name: security-artifacts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-artifacts:
    name: security-artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Scan tracked content for secrets and prohibited artifacts
        run: ./scripts/scan-ci-safety
      - name: Install only what the canary contract needs
        run: python -m pip install --upgrade pip && python -m pip install '.[dev]'
      - name: Verify canaries do not reach logs, stderr, trace capture or errors
        run: pytest -q tests/contract/test_mcp_contract.py -k canary && pytest -q tests/contract/test_privacy_operations.py -k canary
