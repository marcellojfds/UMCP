name: postgres-e2e

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres-e2e:
    name: postgres-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: omp_test
          POSTGRES_PASSWORD: omp_test
          POSTGRES_DB: omp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omp_test -d omp_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install clean development environment
        run: python -m pip install --upgrade pip && python -m pip install '.[dev]'
      - name: Gate PostgreSQL, pgvector, migrations, integration and E2E
        env:
          OMP_TEST_DATABASE_URL: postgresql+asyncpg://omp_test:omp_test@127.0.0.1:5432/omp_test
          OMP_REQUIRE_POSTGRES_TESTS: "1"
        run: ./scripts/gate-postgres
