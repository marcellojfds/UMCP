name: package

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build wheel and source distribution
        run: python -m pip install --upgrade pip build && python -m build
      - name: Scan distribution contents before installation or upload
        run: |
          set -o pipefail
          if unzip -l dist/*.whl | grep -qE '(^|/)(\.env|exports/|artifacts/|.*\.(db|dump|sqlite3?|omp))$'; then
            echo "wheel contains prohibited local data" >&2
            exit 1
          fi
          if tar -tzf dist/*.tar.gz | grep -qE '(^|/)(\.env|exports/|artifacts/|.*\.(db|dump|sqlite3?|omp))$'; then
            echo "sdist contains prohibited local data" >&2
            exit 1
          fi
          if unzip -p dist/*.whl | grep -aqE '(AKIA[0-9A-Z]{16}|-----BEGIN( [A-Z]+)? PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}|AIza[0-9A-Za-z_-]{35})'; then
            echo "wheel contains a secret-shaped value" >&2
            exit 1
          fi
          if tar -xOzf dist/*.tar.gz | grep -aqE '(AKIA[0-9A-Z]{16}|-----BEGIN( [A-Z]+)? PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}|AIza[0-9A-Za-z_-]{35})'; then
            echo "sdist contains a secret-shaped value" >&2
            exit 1
          fi
      - name: Install wheel into a clean virtual environment
        run: |
          python -m venv /tmp/omp-package-venv
          /tmp/omp-package-venv/bin/python -m pip install --upgrade pip
          /tmp/omp-package-venv/bin/python -m pip install dist/*.whl
          /tmp/omp-package-venv/bin/python -m pip check
          /tmp/omp-package-venv/bin/python -c "import omp; assert omp.__version__ == '0.1.0a1'"
          /tmp/omp-package-venv/bin/omp --help
      - name: Retain only package distributions briefly
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1
