name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install clean development environment
        run: python -m pip install --upgrade pip && python -m pip install '.[dev]'
      - name: Ruff (entire repository)
        run: ruff check .
      - name: Mypy
        run: mypy src
      - name: Unit and contract tests
        env:
          OMP_REQUIRE_POSTGRES_TESTS: "0"
        run: pytest -q tests/unit tests/contract
