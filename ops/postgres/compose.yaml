name: omp-gate-postgres

services:
  postgres:
    image: pgvector/pgvector@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: omp_test
      POSTGRES_PASSWORD: omp_test
      POSTGRES_DB: omp_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omp_test -d omp_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: "no"
