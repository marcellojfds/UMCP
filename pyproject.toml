[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "open-memory-protocol"
version = "0.1.0a1"
description = "User-owned long-term memory core for the Open Memory Protocol"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Open Memory Protocol contributors"}]
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "mcp>=1.9,<2",
  "pgvector>=0.3,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "sqlalchemy[asyncio]>=2.0.30,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
semantic = [
  "safetensors==0.4.3",
  "torch==2.3.0",
  "transformers==4.40.1",
]
dev = [
  "httpx>=0.27,<1",
  "httpx2>=2,<3",
  "hypothesis>=6.100,<7",
  "mypy>=1.11,<2",
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
  "ruff>=0.6,<1",
  "testcontainers[postgres]>=4.8,<5",
]

[project.scripts]
omp = "omp.cli.main:main"
omp-migrate = "omp.migrate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omp"]

[tool.hatch.build.targets.wheel.force-include]
migrations = "omp/migrations"

[tool.hatch.build.targets.sdist]
exclude = [
  "/evals/datasets",
  "/evals/reports",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
exclude = ["^migrations/"]
